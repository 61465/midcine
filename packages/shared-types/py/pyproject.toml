[project]
name = "midcine-types"
version = "0.1.0"
description = "Shared Pydantic models for midcine services"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["midcine_types"]
