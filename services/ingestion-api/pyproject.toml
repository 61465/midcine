[project]
name = "midcine-ingestion-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "minio>=7.2",
    "python-multipart>=0.0.17",
    "httpx>=0.27",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "highdicom>=0.24",
    "pydicom>=2.4",
    "structlog>=24.4",
    "midcine-types",
    "midcine-dicom",
]

[tool.uv.sources]
midcine-types = { path = "../../packages/shared-types/py" }
midcine-dicom = { path = "../../packages/dicom-utils" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
