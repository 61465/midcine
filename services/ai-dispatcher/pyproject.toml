[project]
name = "midcine-ai-dispatcher"
version = "0.1.0"
description = "Routes incoming studies to specialist AI models in parallel (ensemble brain)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "redis[hiredis]>=5.2.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "sentry-sdk[fastapi]>=2.19.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "pybreaker>=1.2.0",
]

[tool.uv]
package = false
