[project]
name = "midcine-tunnel-broker"
version = "0.1.0"
description = "Issues short-lived mTLS cert pairs for hospital-to-hospital P2P DICOM transfer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "cryptography>=44.0.0",
    "structlog>=24.4.0",
    "sentry-sdk[fastapi]>=2.19.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[tool.uv]
package = false
