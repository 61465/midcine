[project]
name = "midcine-ai-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "redis>=5.2",
    "minio>=7.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "pydicom>=2.4",
    "highdicom>=0.24",
    "dicom2nifti>=2.4",
    "nibabel>=5.2",
    "SimpleITK>=2.4",
    "structlog>=24.4",
    "midcine-types",
    "midcine-dicom",
]

[tool.uv.sources]
midcine-types = { path = "../../packages/shared-types/py" }
midcine-dicom = { path = "../../packages/dicom-utils" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
