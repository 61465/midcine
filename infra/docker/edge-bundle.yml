# ═══════════════════════════════════════════════════════════════
#  midcine — Edge Bundle (single hospital NUC)
#  On-premises services only. Cloud broker reached via Tailscale Funnel.
#  Borrowed pattern: D:\project\luffy-server\docker-compose.yml
#  Target: 8 GB RAM, no GPU
#
#  Required env vars (define in .env at project root):
#    POSTGRES_PASSWORD       — postgres root password
#    MINIO_ROOT_USER         — minio admin user
#    MINIO_ROOT_PASSWORD     — minio admin password (>= 8 chars)
#    ORTHANC_PASSWORD        — orthanc REST password
#    HOSPITAL_ID             — e.g. "hosp-001"
#    CLOUD_BROKER_URL        — leave empty for pilot (local-only). When set,
#                              points to the per-hospital cloud index broker.
#    EDGE_DATA_ROOT          — e.g. "E:/midcine-edge-data"
# ═══════════════════════════════════════════════════════════════

name: midcine-edge

networks:
  midcine-edge:
    driver: bridge

services:
  # ── Postgres + ParadeDB (pgvector + pg_search) ───────────────────
  postgres:
    image: paradedb/paradedb:latest
    container_name: midcine-edge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: midcine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: midcine
    volumes:
      - ${EDGE_DATA_ROOT:-E:/midcine-edge-data}/postgres:/var/lib/postgresql/data
      - ../sql/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U midcine -d midcine']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - coolify.managed=true
    networks: [midcine-edge]

  # ── Redis Streams ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: midcine-edge-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - ${EDGE_DATA_ROOT:-E:/midcine-edge-data}/redis:/data
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3
    labels:
      - coolify.managed=true
    networks: [midcine-edge]

  # ── MinIO (S3-compatible) ────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: midcine-edge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${EDGE_DATA_ROOT:-E:/midcine-edge-data}/minio:/data
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - coolify.managed=true
    networks: [midcine-edge]

  # ── Orthanc (DICOM core) ─────────────────────────────────────────
  orthanc:
    image: jodogne/orthanc-plugins:latest
    container_name: midcine-edge-orthanc
    restart: unless-stopped
    environment:
      ORTHANC__POSTGRESQL__ENABLE_INDEX: 'true'
      ORTHANC__POSTGRESQL__ENABLE_STORAGE: 'false' # storage stays in MinIO
      ORTHANC__POSTGRESQL__HOST: postgres
      ORTHANC__POSTGRESQL__PORT: 5432
      ORTHANC__POSTGRESQL__DATABASE: midcine
      ORTHANC__POSTGRESQL__USERNAME: midcine
      ORTHANC__POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      ORTHANC__REGISTERED_USERS: |
        {"admin": "${ORTHANC_PASSWORD}"}
      ORTHANC__DICOM_AET: MIDCINE
    volumes:
      - ${EDGE_DATA_ROOT:-E:/midcine-edge-data}/orthanc:/var/lib/orthanc/db
    ports:
      - '8042:8042' # REST + Web UI + DICOMweb
      - '11112:4242' # DICOM C-STORE (standard Orthanc port)
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', '-u', 'admin:${ORTHANC_PASSWORD}', 'http://localhost:8042/system']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      - coolify.managed=true
    networks: [midcine-edge]

  # ── DICOM receiver (custom AET, port 11113) ──────────────────────
  dicom-receiver:
    build:
      context: ../../services/dicom-receiver
      dockerfile: Dockerfile
    image: midcine/dicom-receiver:edge
    container_name: midcine-edge-dicom-receiver
    restart: unless-stopped
    environment:
      DICOM_AET: MIDCINE
      DICOM_PORT: 11113
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: admin
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
    ports:
      - '11113:11113'
    depends_on:
      orthanc:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 11113 || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - coolify.managed=true
    networks: [midcine-edge]

  # ── Edge pusher (sends signed events to cloud broker) ────────────
  edge-pusher:
    build:
      context: ../../apps/edge-pusher
      dockerfile: Dockerfile
    image: midcine/edge-pusher:edge
    container_name: midcine-edge-pusher
    restart: unless-stopped
    environment:
      HOSPITAL_ID: ${HOSPITAL_ID}
      CLOUD_BROKER_URL: ${CLOUD_BROKER_URL}
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USER: admin
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD}
      REDIS_URL: redis://redis:6379
    depends_on:
      orthanc:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      - coolify.managed=true
    networks: [midcine-edge]

  # ── Caddy (reverse proxy + auto-TLS) ─────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: midcine-edge-caddy
    restart: unless-stopped
    volumes:
      - ./Caddyfile.edge:/etc/caddy/Caddyfile:ro
      - ${EDGE_DATA_ROOT:-E:/midcine-edge-data}/caddy:/data
    ports:
      - '8443:443'
      - '8080:80'
    depends_on:
      orthanc:
        condition: service_healthy
    labels:
      - coolify.managed=true
    networks: [midcine-edge]
